name: Ejecutar Pruebas de Carga con k6

on:
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions en la web
  push:
    branches: [ main ]

jobs:
  k6-load-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Ejecutar pruebas de carga k6
        uses: grafana/k6-action@v0.5.0
        with:
          filename: load-test/k6-test.js
