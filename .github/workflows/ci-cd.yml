name: Pipeline CI/CD - Fase 2 ACS

on:
  push:
    branches: [ main, qa ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necesario para el análisis de SonarCloud

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar dependencias del Backend
        run: |
          cd backend
          npm install

      - name: Ejecutar Pruebas Unitarias (Jest)
        run: |
          cd backend
          npm test

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Análisis Estático de Código (SonarCloud)
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Instalar Newman para Pruebas de API
        run: npm install -g newman

      - name: Ejecutar Pruebas de API automatizadas
        run: |
          newman run postman/collection.json --env-var "baseUrl=https://proyecto-acs-fase1.onrender.com"
